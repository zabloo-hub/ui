name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push used to leave the run it interrupted going: full builds, tests and
# `verify:pack` on both platforms, for a commit nobody is looking at any more.
# `main` is not cancelled — those runs are the record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this PR actually touched, so a docs-only change runs nothing heavy and a
  # core change does not compile the TypeScript workspace twice. Four zones, and
  # a change to the workflows themselves means "everything". The full platform
  # matrices — six Godot targets, five Unity ones, three OSes for the C ABI — do
  # NOT run per PR any more: they are `prerelease.yml`, weekly and on demand,
  # which is also what packs both SDK artifacts. What a PR gets is the cheapest
  # build that proves the code compiles and the corpus still passes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.zones.outputs.ts }}
      core: ${{ steps.zones.outputs.core }}
      godot: ${{ steps.zones.outputs.godot }}
      unity: ${{ steps.zones.outputs.unity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: zones
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base" 2>/dev/null; then
            files="EVERYTHING"
          else
            files="$(git diff --name-only "$base" HEAD)"
          fi
          echo "$files"
          zone() { echo "$files" | grep -Eq "$1" && echo true || echo false; }
          all=$(zone '^(EVERYTHING|\.github/workflows/)')
          core=$(zone '^(core/|golden/)')
          godot=$(zone '^(sdk/godot/|examples/godot-playground/)')
          unity=$(zone '^(sdk/unity/|examples/unity-playground/)')
          # TypeScript is everything that is not one of the three engine zones
          # and not prose. `.changeset/` counts: the gate in `ci` reads it.
          ts=$(echo "$files" | grep -Ev '^(core/|golden/|sdk/|examples/godot-playground/|examples/unity-playground/|docs/)' | grep -Ev '\.md$' | grep -q . && echo true || echo false)
          for z in ts core godot unity; do
            v=$(eval echo \$$z); [ "$all" = true ] && v=true
            echo "$z=$v" >> "$GITHUB_OUTPUT"; echo "$z=$v"
          done

  ci:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    # Game studios are mostly on Windows, and the critical path is full of things
    # that differ there: recursive `fs.watch`, jiti's `pathToFileURL` resolution
    # base, path separators, bin shims and shebangs. The code already anticipates
    # it (`assets.ts` normalizes backslashes) — which is exactly why it deserves a
    # matrix entry rather than a comment.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset gate diffs this branch against the PR's base commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `build` reinstalls halfway through — that is how the bin shims get linked
      # once `packages/cli/dist/` exists (ZAB-77). It is now `--frozen-lockfile`
      # like the step above it, and this is what keeps it that way: a reinstall
      # that resolves something new would rewrite the lockfile, and the job that
      # was supposed to be a reproducible install would be the one doing it.
      - name: The build left the lockfile alone
        run: git diff --exit-code pnpm-lock.yaml

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint

      # Relative links and anchors across the docs. ZAB-75 swept them by hand and
      # still left four broken anchors behind, which is the argument for a check
      # rather than a reviewer. Linux only: it reads the tree, and a link is not
      # a property of the platform.
      - run: pnpm docs:links
        if: runner.os == 'Linux'

      # Every change that reaches a tarball carries a changeset, or the first
      # changelog comes out empty. Skipped on the Version Packages PR, which is
      # changesets CONSUMING them, and on Linux only — it is a property of the
      # diff, not of the platform.
      - name: Changeset gate
        if: >-
          runner.os == 'Linux' && github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: node scripts/changeset-gate.mjs --since ${{ github.event.pull_request.base.sha }}

      # The publish dry run: pack the packages and install them into a clean
      # consumer outside the workspace. Catches what only breaks once pnpm's
      # symlinks are gone — a file `files` left out, an entry point that does
      # not resolve, a bin without its shebang. Linux only: it packs five
      # packages and does a real npm install, and what it guards against is
      # platform-independent.
      - run: pnpm verify:pack
        if: runner.os == 'Linux'

  # The job that fails on every PR, so it is the one that has to be fast: it
  # compiles the core ALONE — no godot-cpp, no Godot, no GPU — and runs its
  # tests. That it can is the property the whole frontier of ZAB-134 rests on:
  # the core produces a ViewSnapshot with no engine, so the golden corpus can be
  # its test (G3, ZAB-136).
  core-tests:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.godot == 'true' || needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      # Warnings are errors here and nowhere else: this is our code, built with
      # one compiler we choose. The extension build below compiles godot-cpp too,
      # which is not ours to keep warning-free.
      - name: Build the core and run its tests
        working-directory: core
        run: scons werror=true test

  # The C ABI (UN2, ZAB-195): the same core compiled into `libzabloo.*` with
  # only the `ZB_EXPORT` symbols visible, and the golden corpus replayed through
  # the C header alone. Three platforms, because each is somewhere a
  # `DllImport("zabloo")` has to load it — and the test that says the frontier
  # does not change the answer is cheap enough to run everywhere it is built.
  # Two invocations on purpose: `capi` next to `test` is a FILTER (the ticket's
  # `scons test capi`), and this job wants the whole suite on every platform.
  # Linux only per PR; macOS and Windows run in `prerelease.yml`. The corpus
  # through the C header is the same on all three — what differs is the
  # toolchain, and that is the prerelease's question.
  capi-tests:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.unity == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      # The locale test arms its trap with a Spanish locale — `strtod` and
      # `printf` reading `0,5` — and `ZB_REQUIRE_LOCALE` below turns "none on
      # this machine" from a note into a failure. macOS and Windows ship one;
      # the Linux runner has to generate it.
      - name: A Spanish locale, so the locale test is real
        if: runner.os == 'Linux'
        run: sudo locale-gen es_ES.UTF-8

      - name: Build the C ABI library
        working-directory: core
        shell: bash
        run: scons werror=true capi

      - name: Run the core's tests, the corpus through the C header included
        working-directory: core
        shell: bash
        env:
          ZB_REQUIRE_LOCALE: "1"
        run: scons werror=true test

      - uses: actions/upload-artifact@v4
        with:
          name: zabloo-capi-${{ matrix.os }}
          path: |
            core/bin/libzabloo.dylib
            core/bin/libzabloo.so
            core/bin/zabloo.dll
          if-no-files-found: error

  # Compiles the GDExtension and keeps the artifact — per PR the host platform,
  # every platform in the prerelease. It does not RUN anything: what needs a real engine — geometry
  # reaching a draw call, input arriving, an export booting — is verified by hand
  # against the playground and, for the desktop and web exports, in G15 (ZAB-148).
  #
  # Android and iOS compile here and have NOT been run on a device: G15 had no
  # NDK-equipped machine and no phone to hand, and that gap is written down in
  # `docs/performance.md` and carried by ZAB-193 rather than papered over. A job
  # that only compiles is still worth having — it is what stops those toolchains
  # rotting silently in the meantime.
  godot-extension:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.godot == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The host build only. The other five targets (Linux arm64, macOS,
          # Windows, Android, iOS) and web are `prerelease.yml`'s.
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      # godot-cpp PINS an NDK version (23.2.8568313 on the 4.4 branch) and builds
      # the toolchain path out of it, so `$ANDROID_HOME/ndk/<that version>` has to
      # exist. The runner ships whatever is current instead, and the build dies
      # before compiling a line. Telling the pin what is actually installed is the
      # whole fix.
      - name: Point the build at the NDK the runner has
        if: matrix.platform == 'android'
        shell: bash
        run: echo "SCONS_EXTRA=ndk_version=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Build the extension
        working-directory: sdk/godot
        shell: bash
        env:
          ARCH: ${{ matrix.arch && format('arch={0}', matrix.arch) || '' }}
        run: scons target=template_release platform=${{ matrix.platform }} $ARCH $SCONS_EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: zabloo-addon-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: sdk/godot/addons/zabloo/bin/
          if-no-files-found: error

  # The native core for the Unity package (UN9,
  # ZAB-202): `scons capi` in `core/` — `platform=` for the two cross-compiles —
  # then `scons install platform=…` in `sdk/unity`, which is what puts the
  # binary in its `Runtime/Plugins/<platform>/` slot AND writes the `.meta` next
  # to it. The artifact is that slot, ready for the `.tgz` (UN11) to consume.
  #
  # Android and iOS COMPILE here and have not been run on a device — no phone,
  # same basket as the Godot addon (ZAB-193), and `docs/performance.md` says
  # so. Unity itself does not run in CI: it needs a license on the runner
  # (docs/releasing.md › Unity in CI); the players are built by hand.
  # `werror` only where the compiler is ours to choose: the NDK's and Xcode's
  # clang bring their own warning sets, and the extension job makes the same
  # allowance.
  unity-plugin:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.unity == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The host build only; macOS, Windows, Android and iOS are `prerelease.yml`'s.
          - os: ubuntu-latest
            platform: linux
            flags: werror=true
            slot: Linux/x86_64/libzabloo.so
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      # `core/SConstruct` finds the NDK under `$ANDROID_HOME/ndk/` on its own
      # (newest version); this only says which one was used, for the log.
      - name: The NDK this runner has
        if: matrix.platform == 'android'
        run: ls "$ANDROID_HOME/ndk"

      - name: Build the native core
        working-directory: core
        shell: bash
        run: scons target=release capi platform=${{ matrix.platform }} ${{ matrix.flags }}

      # A dylib that quietly came out single-arch would load in the editor of
      # the machine that built it and nowhere else.
      - name: The macOS dylib carries both slices
        if: matrix.platform == 'macos'
        run: lipo -info core/bin/libzabloo.dylib | grep -q x86_64 && lipo -info core/bin/libzabloo.dylib | grep -q arm64

      - name: Install it into the package, with its .meta
        working-directory: sdk/unity
        shell: bash
        run: scons install platform=${{ matrix.platform }}

      # The slot is the contract: the path the `.meta` templates in
      # `sdk/unity/SConstruct` name, and the one the pack (UN11) will read.
      - name: Binary and .meta are in the slot
        shell: bash
        run: |
          test -s "sdk/unity/Runtime/Plugins/${{ matrix.slot }}"
          test -s "sdk/unity/Runtime/Plugins/${{ matrix.slot }}.meta"
          grep -q PluginImporter "sdk/unity/Runtime/Plugins/${{ matrix.slot }}.meta"

      - uses: actions/upload-artifact@v4
        with:
          name: zabloo-unity-plugin-${{ matrix.platform }}
          path: sdk/unity/Runtime/Plugins/${{ matrix.slot }}*
          if-no-files-found: error
