name: CI

on:
  push:
    branches: [main]
  pull_request:

# A force-push used to leave the run it interrupted going: full builds, tests and
# `verify:pack` on both platforms, for a commit nobody is looking at any more.
# `main` is not cancelled — those runs are the record of what landed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Game studios are mostly on Windows, and the critical path is full of things
    # that differ there: recursive `fs.watch`, jiti's `pathToFileURL` resolution
    # base, path separators, bin shims and shebangs. The code already anticipates
    # it (`assets.ts` normalizes backslashes) — which is exactly why it deserves a
    # matrix entry rather than a comment.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The changeset gate diffs this branch against the PR's base commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # `build` reinstalls halfway through — that is how the bin shims get linked
      # once `packages/cli/dist/` exists (ZAB-77). It is now `--frozen-lockfile`
      # like the step above it, and this is what keeps it that way: a reinstall
      # that resolves something new would rewrite the lockfile, and the job that
      # was supposed to be a reproducible install would be the one doing it.
      - name: The build left the lockfile alone
        run: git diff --exit-code pnpm-lock.yaml

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint

      # Relative links and anchors across the docs. ZAB-75 swept them by hand and
      # still left four broken anchors behind, which is the argument for a check
      # rather than a reviewer. Linux only: it reads the tree, and a link is not
      # a property of the platform.
      - run: pnpm docs:links
        if: runner.os == 'Linux'

      # Every change that reaches a tarball carries a changeset, or the first
      # changelog comes out empty. Skipped on the Version Packages PR, which is
      # changesets CONSUMING them, and on Linux only — it is a property of the
      # diff, not of the platform.
      - name: Changeset gate
        if: >-
          runner.os == 'Linux' && github.event_name == 'pull_request' &&
          !startsWith(github.head_ref, 'changeset-release/')
        run: node scripts/changeset-gate.mjs --since ${{ github.event.pull_request.base.sha }}

      # The publish dry run: pack the packages and install them into a clean
      # consumer outside the workspace. Catches what only breaks once pnpm's
      # symlinks are gone — a file `files` left out, an entry point that does
      # not resolve, a bin without its shebang. Linux only: it packs five
      # packages and does a real npm install, and what it guards against is
      # platform-independent.
      - run: pnpm verify:pack
        if: runner.os == 'Linux'

  # The job that fails on every PR, so it is the one that has to be fast: it
  # compiles the core ALONE — no godot-cpp, no Godot, no GPU — and runs its
  # tests. That it can is the property the whole frontier of ZAB-134 rests on:
  # the core produces a ViewSnapshot with no engine, so the golden corpus can be
  # its test (G3, ZAB-136).
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      # Warnings are errors here and nowhere else: this is our code, built with
      # one compiler we choose. The extension build below compiles godot-cpp too,
      # which is not ours to keep warning-free.
      - name: Build the core and run its tests
        working-directory: core
        run: scons werror=true test

  # The C ABI (UN2, ZAB-195): the same core compiled into `libzabloo.*` with
  # only the `ZB_EXPORT` symbols visible, and the golden corpus replayed through
  # the C header alone. Three platforms, because each is somewhere a
  # `DllImport("zabloo")` has to load it — and the test that says the frontier
  # does not change the answer is cheap enough to run everywhere it is built.
  # Two invocations on purpose: `capi` next to `test` is a FILTER (the ticket's
  # `scons test capi`), and this job wants the whole suite on every platform.
  capi-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      # The locale test arms its trap with a Spanish locale — `strtod` and
      # `printf` reading `0,5` — and `ZB_REQUIRE_LOCALE` below turns "none on
      # this machine" from a note into a failure. macOS and Windows ship one;
      # the Linux runner has to generate it.
      - name: A Spanish locale, so the locale test is real
        if: runner.os == 'Linux'
        run: sudo locale-gen es_ES.UTF-8

      - name: Build the C ABI library
        working-directory: core
        shell: bash
        run: scons werror=true capi

      - name: Run the core's tests, the corpus through the C header included
        working-directory: core
        shell: bash
        env:
          ZB_REQUIRE_LOCALE: "1"
        run: scons werror=true test

      - uses: actions/upload-artifact@v4
        with:
          name: zabloo-capi-${{ matrix.os }}
          path: |
            core/bin/libzabloo.dylib
            core/bin/libzabloo.so
            core/bin/zabloo.dll
          if-no-files-found: error

  # Compiles the GDExtension for every platform the addon ships for, and keeps the
  # artifacts. It does not RUN anything: what needs a real engine — geometry
  # reaching a draw call, input arriving, an export booting — is verified by hand
  # against the playground and, for the desktop and web exports, in G15 (ZAB-148).
  #
  # Android and iOS compile here and have NOT been run on a device: G15 had no
  # NDK-equipped machine and no phone to hand, and that gap is written down in
  # `docs/performance.md` and carried by ZAB-193 rather than papered over. A job
  # that only compiles is still worth having — it is what stops those toolchains
  # rotting silently in the meantime.
  godot-extension:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          # The .gdextension declares Linux arm64 too, so the release zip carries
          # it (godot-addon.yml) — and this is the entry that keeps it from being
          # a toolchain nobody compiles until the day it has to work.
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      # godot-cpp PINS an NDK version (23.2.8568313 on the 4.4 branch) and builds
      # the toolchain path out of it, so `$ANDROID_HOME/ndk/<that version>` has to
      # exist. The runner ships whatever is current instead, and the build dies
      # before compiling a line. Telling the pin what is actually installed is the
      # whole fix.
      - name: Point the build at the NDK the runner has
        if: matrix.platform == 'android'
        shell: bash
        run: echo "SCONS_EXTRA=ndk_version=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Build the extension
        working-directory: sdk/godot
        shell: bash
        env:
          ARCH: ${{ matrix.arch && format('arch={0}', matrix.arch) || '' }}
        run: scons target=template_release platform=${{ matrix.platform }} $ARCH $SCONS_EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: zabloo-addon-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: sdk/godot/addons/zabloo/bin/
          if-no-files-found: error

  # Web, on its own and NEVER blocking (2026-08-24, Decision 4): a GDExtension on
  # the web needs `dlink` export templates and an Emscripten whose ABI matches the
  # one Godot's own templates were built with, and neither is ours to pin. The
  # criterion for web is that it LOADS, which is checked by hand against a real
  # export — `docs/performance.md` records what that check found.
  godot-extension-web:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install scons

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10

      - name: Build the extension
        working-directory: sdk/godot
        run: scons target=template_release platform=web

      - uses: actions/upload-artifact@v4
        with:
          name: zabloo-addon-web
          path: sdk/godot/addons/zabloo/bin/
          if-no-files-found: error
