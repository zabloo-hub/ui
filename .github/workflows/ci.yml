name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm lint

      # The publish dry run: pack the packages and install them into a clean
      # consumer outside the workspace. Catches what only breaks once pnpm's
      # symlinks are gone — a file `files` left out, an entry point that does
      # not resolve, a bin without its shebang.
      - run: pnpm verify:pack
